<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Вход</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="login"><form method="post" class="panel">
  <h1>Рекламации</h1>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  <label class="f"><span>Логин</span><input name="login" autofocus required></label>
  <label class="f"><span>Пароль</span><input name="password" type="password" required></label>
  <button class="btn primary big">Войти</button>
</form></div></body></html>
